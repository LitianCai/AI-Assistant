{% extends "base.html" %}
{% block content %}
<h1>Sign in</h1>
{% if error %}
<p class="alert" role="alert">{{ error }}</p>
{% endif %}
<form method="post" action="/login">
  <label for="user-name">User name</label>
  <input id="user-name" name="userName" type="text" placeholder="riley.chen" autocomplete="username" required>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
